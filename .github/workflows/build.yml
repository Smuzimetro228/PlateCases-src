name: Build PlateCases

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip "PlateCases-src_5307cb06-f371-4e41-b595-320ebd5a5d8d.zip"

      - name: Check project
        run: ls -la PlateCases

      - name: Build plugin
        run: mvn -B clean package
        working-directory: PlateCases

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlateCases
          path: PlateCases/target/*.jar
          if-no-files-found: error
